name: Codex ChatGPT Provider CI

on:
  push:
    branches:
      - codex/codex-chatgpt-provider
  workflow_dispatch:

concurrency:
  group: codex-chatgpt-provider-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '22'
  PNPM_VERSION: '10.28.0'
  FLUTTER_VERSION: '3.47.2'
  ANDROID_PLATFORM_VERSION: '37.0'
  NDK_VERSION: '28.2.13676358'
  ALLOWED_THIRD_PARTY_WRAPPER_SHA: 'ee3739525a995bcb5601621a6e2daec1f183bbefc375743acc235cec33547e04'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/codex-chatgpt-provider

      - name: Apply source patches
        run: |
          python3 scripts/grimcore/apply_codex_chatgpt_backend.py
          python3 scripts/grimcore/fix_codex_chatgpt_backend.py
          python3 scripts/grimcore/apply_codex_chatgpt_ui.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Flutter dependencies
        working-directory: ui
        run: flutter pub get --enforce-lockfile

      - name: Format and generate localization
        working-directory: ui
        run: |
          dart format \
            lib/services/model_provider_config_service.dart \
            lib/services/agent_runtime_service.dart \
            lib/services/codex_chatgpt_account_service.dart \
            lib/features/home/pages/model_provider_setting/model_provider_setting_page.dart \
            test/services/codex_chatgpt_account_service_test.dart \
            test/services/model_provider_codex_profile_test.dart
          flutter gen-l10n

      - name: Validate generated diff
        run: |
          git diff --check
          python3 -m json.tool app/src/main/assets/acp/agents.json >/dev/null
          python3 -m json.tool ui/lib/l10n/app_en.arb >/dev/null
          python3 -m json.tool ui/lib/l10n/app_ru.arb >/dev/null
          python3 -m json.tool ui/lib/l10n/app_zh.arb >/dev/null
          grep -R --line-number 'gpt-5.3-codex-spark' \
            baselib app/src/main ui/lib ui/test

      - name: Commit generated provider sources
        id: source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add \
              app/build.gradle.kts \
              app/src/main/assets/acp/agents.json \
              app/src/main/java/cn/com/omnimind/bot/agent/runtime \
              app/src/main/java/cn/com/omnimind/bot/manager/AssistsCoreManager.kt \
              app/src/test/java/cn/com/omnimind/bot/agent/runtime \
              baselib/src/main/java/cn/com/omnimind/baselib/llm \
              baselib/src/test/java/cn/com/omnimind/baselib/llm \
              ui/lib/features/home/pages/model_provider_setting/model_provider_setting_page.dart \
              ui/lib/services/agent_runtime_service.dart \
              ui/lib/services/codex_chatgpt_account_service.dart \
              ui/lib/services/model_provider_config_service.dart \
              ui/lib/l10n/app_en.arb \
              ui/lib/l10n/app_ru.arb \
              ui/lib/l10n/app_zh.arb \
              ui/lib/l10n/generated \
              ui/test/services/codex_chatgpt_account_service_test.dart \
              ui/test/services/model_provider_codex_profile_test.dart
            git commit -m "feat: add Codex ChatGPT provider UI"
            git push origin HEAD:codex/codex-chatgpt-provider
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: webchat/pnpm-lock.yaml

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
        with:
          allow-checksums: ${{ env.ALLOWED_THIRD_PARTY_WRAPPER_SHA }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platforms;android-${{ env.ANDROID_PLATFORM_VERSION }}" \
            "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: GrimCore contracts
        run: |
          python3 scripts/grimcore/check_contract.py
          python3 scripts/grimcore/check_localization.py
          python3 scripts/grimcore/check_no_secrets.py
          for file in scripts/grimcore/*.sh; do bash -n "$file"; done

      - name: Flutter test
        working-directory: ui
        run: flutter test

      - name: Flutter analyze
        working-directory: ui
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Gradle unit tests, lint and ARM64 debug APK
        run: >-
          ./gradlew --no-daemon --parallel --build-cache --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED"
          :app:testDevelopStandardDebugUnitTest
          :app:lintDevelopStandardDebug
          :app:assembleDevelopStandardDebug
          -Ptarget=lib/main_standard.dart
          -PgrimAbiArm64Only=true

      - name: APK manifest
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/developStandard/debug/app-develop-standard-debug.apk
          test -f "$APK"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          SIZE=$(stat -c '%s' "$APK")
          printf 'source_sha=%s\nsize_bytes=%s\nsha256=%s\n' \
            "${{ steps.source.outputs.sha }}" "$SIZE" "$SHA256" | tee codex-chatgpt-apk.txt
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

      - name: Upload ARM64 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GrimCore-${{ steps.source.outputs.sha }}-codex-chatgpt-arm64-v8a-debug
          path: |
            app/build/outputs/apk/developStandard/debug/app-develop-standard-debug.apk
            codex-chatgpt-apk.txt
          if-no-files-found: error
          retention-days: 14
